name: Bug Report
description: Report a reproducible defect or regression in ProCVMaker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue. Please avoid sharing sensitive personal resume data, API keys, or private tokens.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the CV Builder / ATS Checker / Job Match view
        2. Perform action...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and Node.js version (if running locally)
      placeholder: e.g. Chrome 134, Ubuntu 24.04, Node 20
    validations:
      required: false
