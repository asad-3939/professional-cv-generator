<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient matching bg-gradient-to-tr from-indigo-600 via-blue-500 to-teal-400 -->
    <linearGradient id="aiLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Rounded Rectangle matching rounded-lg -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#aiLogoGrad)" />

  <!-- Bold, Black-weighted "AI" Text perfectly centered -->
  <text 
    x="256" 
    y="268" 
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="240" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    dominant-baseline="middle"
    letter-spacing="-8"
  >AI</text>
</svg>
