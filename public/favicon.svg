<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Cosmic Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040a18" />
      <stop offset="100%" stop-color="#0b1528" />
    </linearGradient>

    <!-- Glowing Blue/Cyan Orbital Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="140" y1="370" x2="420" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- AI Text Vibrant Cyber Gradient -->
    <linearGradient id="aiTextGrad" x1="100" y1="230" x2="220" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- User Avatar Slate/Blue Gradient -->
    <linearGradient id="avatarGrad" x1="190" y1="120" x2="250" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Document Fold Gradient -->
    <linearGradient id="docFoldGrad" x1="286" y1="76" x2="356" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Soft Drop Shadow for the Document Sheet -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Dark Background Frame -->
  <circle cx="256" cy="256" r="242" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Background Decorative Glowing Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.15" />

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Main Paper Body (White with Folded Top Right Corner) -->
    <path 
      d="M 172 76 h 114 l 70 70 v 194 a 16 16 0 0 1 -16 16 H 172 a 16 16 0 0 1 -16 -16 V 92 a 16 16 0 0 1 16 -16 Z" 
      fill="#ffffff" 
    />
    
    <!-- Paper Fold Corner Flap -->
    <path 
      d="M 286 76 v 54 a 16 16 0 0 0 16 16 h 54 Z" 
      fill="url(#docFoldGrad)" 
    />
  </g>

  <!-- Inside Document Content -->
  <!-- User Profile Avatar -->
  <circle cx="220" cy="140" r="20" fill="url(#avatarGrad)" />
  <path d="M 194 196 c 0 -13 11 -21 26 -21 s 26 8 26 21 H 194 Z" fill="url(#avatarGrad)" />

  <!-- Header Lines Next to Avatar -->
  <line x1="262" y1="134" x2="318" y2="134" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="262" y1="152" x2="328" y2="152" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="262" y1="170" x2="304" y2="170" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

  <!-- Divider Line -->
  <line x1="184" y1="216" x2="328" y2="216" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

  <!-- Lower Details Lines (Tapering to make room for AI text overlap on the left) -->
  <line x1="228" y1="236" x2="328" y2="236" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  <line x1="236" y1="254" x2="328" y2="254" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  <line x1="216" y1="272" x2="328" y2="272" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
  <line x1="184" y1="290" x2="328" y2="290" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
  <line x1="184" y1="308" x2="298" y2="308" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

  <!-- Dynamic Cyber Swoosh/Orbital Ring wrapping up the right side -->
  <path 
    d="M 136 364 C 172 422, 366 414, 404 284 C 418 238, 412 188, 396 156 C 408 184, 408 244, 388 288 C 354 366, 196 400, 136 364 Z" 
    fill="url(#swooshGrad)" 
  />

  <!-- Bold Neon Blue "AI" Label overlapping the bottom-left -->
  <text 
    x="84" 
    y="336" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="94" 
    font-weight="900" 
    fill="url(#aiTextGrad)" 
    letter-spacing="-4" 
    style="text-shadow: 0 4px 16px rgba(56, 189, 248, 0.45);"
  >AI</text>
</svg>
